name: generate pacman contribution graph

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: checkout repository
        uses: actions/checkout@v4

      - name: generate pacman contribution graph
        uses: abozanona/pacman-contribution-graph@main
        with:
          github_user_name: ${{ github.repository_owner }}
          games: 'pacman'
          hide_month_labels: 'true'

      - name: commit and push
        run: |
          git config --global user.name "Felipe Gabriel Serejo de Andrade"
          git config --global user.email "232819648+sshs3rejo@users.noreply.github.com"
          git add output/*.svg
          git commit -m "Update Pac-Man contribution graph [ci skip]" || echo "No changes"
          git push origin HEAD:main
