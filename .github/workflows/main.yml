name: generate pacman contribution graph

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: checkout repository
        uses: actions/checkout@v4

      - name: generate pacman contribution graph
        uses: abozanona/pacman-contribution-graph@v5.3.2
        with:
          github_user_name: ${{ github.repository_owner }}
          games: 'pacman'
          hide_month_labels: 'true'

      - name: locate generated svgs
        run: |
          mkdir -p output
          find . -maxdepth 3 -name "pacman-contribution-graph*.svg" -type f -exec mv {} output/ \; 2>/dev/null || true
          echo "=== output dir ==="
          ls -la output/

      - name: verify svgs were generated
        run: |
          test -s output/pacman-contribution-graph.svg || {
            echo "::error::pacman-contribution-graph.svg was not generated"
            exit 1
          }
          echo "svg ok: $(wc -c < output/pacman-contribution-graph.svg) bytes"

      - name: commit and push
        run: |
          git config --global user.name "Felipe Gabriel Serejo de Andrade"
          git config --global user.email "232819648+sshs3rejo@users.noreply.github.com"
          git add output/*.svg
          if git diff --cached --quiet; then
            echo "no changes to commit"
          else
            git commit -m "chore: atualiza gráfico de contribuições [ci skip]"
            git push origin HEAD:main
          fi
